<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="/CSS/common.css">
<link rel="stylesheet" href="/CSS/auth.css">
<link rel="stylesheet" href="/CSS/login.css">
</head>
<body>

<main class="auth-page"><section class="auth-card login-card">
<div class="auth-brand">LibraByte</div><h1>Welcome Back</h1><p class="subtitle">Sign in to your digital library.</p>
<form id="loginForm">
<div class="form-group"><label for="email">Email</label><input id="email" class="form-control" type="email" required autocomplete="email"></div>
<div class="form-group"><label for="password">Password</label><div class="password-wrap"><input id="password" class="form-control" type="password" required autocomplete="current-password"><button type="button" class="password-toggle" id="togglePassword">Show</button></div></div>
<button id="loginBtn" class="btn btn-primary" style="width:100%">Login</button>
</form>
<div class="auth-links"><a href="/HTML/forgot-password.html">Forgot password?</a><a href="/HTML/register.html">Create account</a></div>
</section></main>
<script src="/JavaScript/common.js"></script>
<script src="/JavaScript/login.js"></script>
</body>
</html>
