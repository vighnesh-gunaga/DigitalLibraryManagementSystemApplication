<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="/CSS/common.css">
<link rel="stylesheet" href="/CSS/auth.css">
<link rel="stylesheet" href="/CSS/forgot-password.css">
</head>
<body>

<main class="auth-page"><section class="auth-card forgot-card">
<div class="auth-brand">LibraByte</div><h1>Forgot Password</h1><p class="subtitle">Enter your email to generate a reset link.</p>
<div id="message" class="auth-message hidden"></div>
<form id="forgotForm">
<div class="form-group"><label for="email">Email</label><input id="email" class="form-control" type="email" required autocomplete="email"></div>
<button id="forgotBtn" class="btn btn-warning" style="width:100%">Generate Reset Link</button>
</form>
<div class="auth-links"><span></span><a href="/HTML/login.html">Back to Login</a></div>
</section></main>
<script src="/JavaScript/common.js"></script>
<script src="/JavaScript/forgot-password.js"></script>
</body>
</html>
