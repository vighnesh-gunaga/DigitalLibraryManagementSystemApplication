<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="/CSS/common.css">
<link rel="stylesheet" href="/CSS/auth.css">
<link rel="stylesheet" href="/CSS/reset-password.css">
</head>
<body>

<main class="auth-page"><section class="auth-card reset-card">
<div class="auth-brand">LibraByte</div><h1>Reset Password</h1><p class="subtitle">Choose a new password below.</p>
<div id="message" class="auth-message hidden"></div>
<form id="resetForm">
<div class="form-group"><label for="newPassword">New Password</label><div class="password-wrap"><input id="newPassword" class="form-control" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="password-toggle" id="togglePassword">Show</button></div></div>
<div class="form-group"><label for="confirmPassword">Confirm Password</label><div class="password-wrap"><input id="confirmPassword" class="form-control" type="password" required minlength="6" autocomplete="new-password"><button type="button" class="password-toggle" id="toggleConfirm">Show</button></div></div>
<button id="resetBtn" class="btn btn-primary" style="width:100%">Reset Password</button>
</form>
<div class="auth-links"><span></span><a href="/HTML/login.html">Back to Login</a></div>
</section></main>
<script src="/JavaScript/common.js"></script>
<script src="/JavaScript/reset-password.js"></script>
</body>
</html>
